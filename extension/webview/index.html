<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; font-src {{cspSource}}; img-src {{cspSource}}; script-src 'nonce-{{nonce}}' {{cspSource}};" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="{{stylesUri}}" />
<title>Plan Graph</title>
</head>
<body>
<div class="planmap-root">

  <nav class="app-rail" aria-label="PlanMap views">
    <!-- The mark from logo.html, drawn heavier for the rail: the same six
         strokes, nothing added. Weight and spacing move together - at 120 the
         two halves close up on the original geometry, so the split between
         them opened from 155 to 200 and the gap reads as it always did. -->
    <svg class="rail-mark" viewBox="0 0 2000 2000" width="38" height="38" fill="none" stroke="currentColor"
         stroke-width="120" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="PlanMap">
      <path d="M455 900 L665 520 Q710 455 795 455 L1180 455 Q1260 455 1300 520 L1545 900"/>
      <path d="M455 900 L1290 900"/>
      <path d="M1175 690 L1290 900"/>
      <path d="M440 1100 L650 1455 Q700 1530 790 1530 L1180 1530 Q1260 1530 1305 1460 L1530 1100"/>
      <path d="M670 1100 L1515 1100"/>
      <path d="M670 1100 L835 1300"/>
    </svg>
    <div class="rail-views" role="radiogroup" aria-label="View">
      <button class="nav-icon-btn active" data-nav="planmap" role="radio" aria-checked="true" title="Plan Graph" aria-label="Plan Graph">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <rect x="7.5" y="2" width="5" height="4" rx="1"/><rect x="2" y="14" width="5" height="4" rx="1"/><rect x="13" y="14" width="5" height="4" rx="1"/>
          <path d="M10 6v4M4.5 14v-2.5h11V14"/>
        </svg>
      </button>
      <button class="nav-icon-btn" data-nav="evolution" role="radio" aria-checked="false" tabindex="-1" title="Project Evolution" aria-label="Project Evolution">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M4 3v11a2 2 0 0 0 2 2h4M4 8h4"/><circle cx="15" cy="16" r="1.8"/><circle cx="14" cy="8" r="1.8"/><path d="M8 8h4"/>
        </svg>
        <span class="rail-badge" id="driftBadge" hidden></span>
      </button>
    </div>
    <button class="nav-icon-btn rail-folder" id="openFolderBtn" title="Open another project folder" aria-label="Open another project folder">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.6l1.8 2h6.6a1.5 1.5 0 0 1 1.5 1.5V15a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 15z"/>
      </svg>
    </button>
  </nav>

  <div class="content-row">
    <div class="main-panel">

      <div class="view" id="viewPlanmap">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="breadcrumb" id="breadcrumb"><span class="crumb current">Constellation</span></div>
            <button class="scan-chip" id="scanChip" hidden title="Refresh evolution to fold these in">
              <span class="scan-dot"></span><span id="scanChipText"></span>
            </button>
          </div>
          <!-- The perspective you are reading through, centred: it is a
               property of what you are looking at, not an action. -->
          <div class="lens-switch plan" id="lensSwitch" role="radiogroup" aria-label="Lens"></div>
          <!-- What is left in the header are decisions about the plan, and
               they sit at the right end. One approve button: its label and
               its command follow where you are - the whole plan on the
               Constellation, the active lens inside a feature. -->
          <div class="view-controls">
            <button class="icon-btn" id="approveBtn">Approve plan</button>
            <button class="icon-btn" id="verifyBtn" title="Check every approved plan node against the code">Verify against code</button>
          </div>
        </div>
        <div class="compile-banner" id="compileBanner" role="status"></div>
        <div class="workspace">
          <div class="canvas-area">
            <div class="graph-canvas" id="constellationCanvas">
              <div class="grid-layer" id="constellationGrid"></div>
              <div class="canvas-content" id="constellationContent"><svg class="edges" id="constellationEdges"></svg></div>
              <div class="flow-tag" id="constellationFlowTag" hidden><span class="arrow-up">↑</span> <span id="constellationFlowLabel">the order a person meets them</span></div>
            </div>
            <!-- Level 2. A set, not a journey: behavioural areas are parts of
                 a capability, not stages of it, so they are laid out to be
                 surveyed at a glance rather than followed in order. -->
            <div class="graph-canvas hidden" id="areasCanvas">
              <div class="grid-layer" id="areasGrid"></div>
              <div class="canvas-content" id="areasContent"><svg class="edges" id="areasEdges"></svg></div>
              <div class="flow-tag areas-tag" id="areasTag" hidden><span id="areasTagText"></span></div>
            </div>
            <div class="graph-canvas hidden" id="featureCanvas">
              <div class="grid-layer" id="featureGrid"></div>
              <div class="canvas-content" id="featureContent"><svg class="edges" id="featureEdges"></svg></div>
              <div class="flow-tag"><span class="arrow-down">↓</span> <span id="featureFlowLabel">the order the steps happen</span></div>
            </div>
            <div class="empty-state" id="emptyState" hidden><div class="empty-card" id="emptyCard"></div></div>
            <!-- Tools that act on the canvas live on the canvas, at the edge
                 of the surface they change, rather than in the header with
                 the decisions about the plan. -->
            <div class="canvas-tools" id="canvasTools" aria-label="Canvas tools">
              <button class="ct-btn" id="addNodeBtn" title="Add a step to this feature" aria-label="Add a step">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                  <rect x="2.5" y="4.5" width="9" height="6" rx="1.5"/><path d="M15.5 12v5M13 14.5h5"/>
                </svg>
              </button>
              <div class="ct-sep"></div>
              <button class="ct-btn" id="zoomInBtn" title="Zoom in" aria-label="Zoom in">+</button>
              <div class="ct-zoom" id="zoomLabel">100%</div>
              <button class="ct-btn" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">−</button>
              <div class="ct-sep"></div>
              <button class="ct-btn" id="zoomResetBtn" title="Fit to content" aria-label="Fit to content">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
                </svg>
              </button>
            </div>
          </div>
          <aside class="impact-panel" id="impactPanel" aria-label="Node detail"><div class="impact-inner" id="impactInner"></div></aside>
        </div>
        <div class="statusbar">
          <div class="legend-item"><span class="legend-dot intended"></span>intended</div>
          <div class="legend-item"><span class="legend-dot approved"></span>approved</div>
          <div class="legend-item"><span class="legend-dot implemented"></span>implemented</div>
          <div class="legend-item"><span class="legend-dot drifted"></span>drifted</div>
          <div class="legend-item"><span class="legend-dot error"></span>error</div>
          <div class="legend-item"><span class="legend-dot superseded"></span>superseded</div>
          <div class="spacer"></div>
          <div id="statusHint">Loading plan…</div>
        </div>
      </div>

      <!-- Derived from code and read-only: an outline, no add, drag, edit or context menu. -->
      <div class="view hidden" id="viewEvolution" data-vscode-context='{"preventDefaultContextMenuItems": true}'>
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="breadcrumb"><span class="crumb current" id="evoTitle">Project Evolution</span><span class="derived-chip">Read-only, derived from code</span></div>
            <button class="scan-chip" id="evoScanChip" hidden title="Refresh evolution to fold these in">
              <span class="scan-dot"></span><span id="evoScanChipText"></span>
            </button>
          </div>
          <div class="view-controls">
            <div class="lens-switch" id="tagSwitch" role="radiogroup" aria-label="Filter by tag" hidden></div>
            <button class="icon-btn" id="evoRefreshBtn" title="Scan the code again and rebuild Project Evolution">Refresh evolution</button>
          </div>
        </div>
        <div class="compile-banner" id="evoNotice" role="status"></div>
        <div class="workspace">
          <div class="canvas-area evo-tree-panel" id="evoTreePanel" role="tree" aria-label="Project evolution"></div>
          <div class="empty-state" id="evoEmptyState" hidden><div class="empty-card" id="evoEmptyCard"></div></div>
          <aside class="impact-panel" id="evoDetailPanel" aria-label="Evolution detail"><div class="impact-inner" id="evoDetailInner"></div></aside>
        </div>
        <div class="statusbar">
          <div class="legend-item"><span class="evo-status-icon status-intended">◌</span>intended</div>
          <div class="legend-item"><span class="evo-status-icon status-approved">○</span>approved</div>
          <div class="legend-item"><span class="evo-status-icon status-implemented">●</span>implemented</div>
          <div class="legend-item"><span class="evo-status-icon status-drifted">⚠</span>drifted</div>
          <div class="legend-item"><span class="evo-status-icon status-error">✕</span>error</div>
          <div class="legend-item"><span class="evo-status-icon status-superseded">◐</span>superseded</div>
          <div class="spacer"></div>
          <div id="evoHint"></div>
        </div>
      </div>

    </div>
  </div>
</div>
<script type="module" nonce="{{nonce}}" src="{{mainUri}}"></script>
</body>
</html>
